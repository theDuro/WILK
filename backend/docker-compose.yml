# Sam backend (bez bazy i frontu). Baza musi dzialac na hoscie na porcie 5432.
# Caly system uruchamia docker-compose.yml w glownym katalogu repo.
services:
  web:
    image: flask-app
    build: .
    ports:
      - "5000:5000"
    # host.docker.internal dziala od razu w Docker Desktop (Windows/Mac);
    # na Linuksie trzeba go dodac recznie:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
